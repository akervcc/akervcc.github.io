<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#2a2622"/>
      <stop offset="100%" stop-color="#141210"/>
    </radialGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4c7a1"/>
      <stop offset="100%" stop-color="#d97757"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="64" fill="url(#bg)"/>
  <!-- outer ring -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#d97757" stroke-opacity="0.25" stroke-width="2"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#d97757" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="6 10"/>
  <!-- starburst: 12 rays -->
  <g stroke="url(#core)" stroke-width="18" stroke-linecap="round">
    <line x1="256" y1="176" x2="256" y2="128"/>
    <line x1="256" y1="336" x2="256" y2="384"/>
    <line x1="176" y1="256" x2="128" y2="256"/>
    <line x1="336" y1="256" x2="384" y2="256"/>
    <line x1="199" y1="199" x2="165" y2="165"/>
    <line x1="313" y1="313" x2="347" y2="347"/>
    <line x1="199" y1="313" x2="165" y2="347"/>
    <line x1="313" y1="199" x2="347" y2="165"/>
  </g>
  <!-- core -->
  <circle cx="256" cy="256" r="46" fill="url(#core)"/>
  <circle cx="256" cy="256" r="46" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="2"/>
  <!-- label -->
  <text x="256" y="462" text-anchor="middle" font-family="Georgia, 'Noto Serif CJK TC', serif" font-size="30" fill="#f4e9dc" letter-spacing="4">CLAUDE</text>
</svg>
